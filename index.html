<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, createContext, useContext } = React;
    const SERVICE_TYPES = [
      { key: 'mechanic', label: 'Mobile Mechanic', icon: '⚙', desc: 'On-site repairs' },
      { key: 'tire_change', label: 'Tire Change', icon: '◉', desc: 'Flat tire fix' },
      { key: 'battery_jump', label: 'Battery Jump', icon: '⚡', desc: 'Dead battery' },
      { key: 'towing', label: 'Towing', icon: '⊞', desc: 'Vehicle transport' },
      { key: 'fuel_delivery', label: 'Fuel Delivery', icon: '⛽', desc: 'Gas delivery' },
      { key: 'lockout', label: 'Lockout', icon: '⊠', desc: 'Key issues' },

    const FEATURES = [

      { icon: <div style={{width: 48, height: 48, backgroundColor: '#000', borderRadius: 12, display: 'flex', alignItems: 'center', justifyContent: 'center', overflow: 'hidden'}}><img src="public/wallet.gif" alt="" style={{width: 40, height: 40, filter: 'grayscale(100%) invert(1) contrast(100)'}} /></div>, title: 'Transparent Pricing', desc: 'No hidden fees or surprises' },
      { icon: <div style={{width: 48, height: 48, backgroundColor: '#000', borderRadius: 12, display: 'flex', alignItems: 'center', justifyContent: 'center', overflow: 'hidden'}}><img src="public/calendar.gif" alt="" style={{width: 40, height: 40, filter: 'grayscale(100%) invert(1) contrast(100)'}} /></div>, title: 'Easy Booking', desc: 'Book in seconds' },
    ];
    const TESTIMONIALS = [
      { name: 'Sarah M.', text: 'Saved my day! Mechanic showed up in 20 mins.', rating: 5 },
      { name: 'Mike D.', text: 'Best pricing ever. Highly recommend!', rating: 5 },
      { name: 'Lisa K.', text: 'So easy to use. Found help instantly.', rating: 5 },

    // ============================================
    // ROUTER
    // ============================================
    const ROUTE_MAP = {
      '/': 'landing',
      '/role-select': 'role-select',
      '/login': 'login',
      '/customer/signup': 'customer-signup',
      '/provider/signup': 'provider-signup',
      '/provider/services': 'provider-services',
      '/customer/home': 'customer-home',
      '/customer/request': 'customer-request',
      '/customer/offers': 'customer-offers',
      '/provider/home': 'provider-home',
      '/provider/jobs': 'provider-jobs',
      '/provider/earnings': 'provider-earnings',
    };
    const PATH_MAP = Object.fromEntries(Object.entries(ROUTE_MAP).map(([k, v]) => [v, k]));

    function getPath(screen) { return PATH_MAP[screen] || '/'; }
    function getScreen(path) { return ROUTE_MAP[path] || 'landing'; }

    function useRouter() {
      const [screen, setScreen] = useState(() => getScreen(window.location.pathname));
      const navigate = (pathOrScreen) => {
        const path = pathOrScreen.startsWith('/') ? pathOrScreen : getPath(pathOrScreen);
        window.history.pushState({ screen: getScreen(path) }, '', path);
        setScreen(getScreen(path));
      };
      const goBack = () => window.history.back();
      useEffect(() => {
        const onPopState = () => setScreen(getScreen(window.location.pathname));
        window.addEventListener('popstate', onPopState);
        return () => window.removeEventListener('popstate', onPopState);
      }, []);
      return { screen, navigate, goBack };
    }

    // ============================================
    // USER CONTEXT
    // ============================================
    const UserContext = createContext(null);
    
    function UserProvider({ children }) {
      const [userData, setUserData] = useState({
        uid: null,
        services: [],
        isOnline: false,
        role: null
      });
      const [loading, setLoading] = useState(true);
      
      const fetchUserData = async (uid) => {
        try {
          if (window.firebaseDb && uid) {
            const docRef = doc(window.firebaseDb, "users", uid);
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) {
              const data = docSnap.data();
              setUserData(prev => ({ ...prev, uid, services: data.services || [], isOnline: data.isOnline || false }));
            } else {
              setUserData(prev => ({ ...prev, uid, services: [] }));
            }
          } else {
            setUserData(prev => ({ ...prev, uid, services: [] }));
          }
        } catch (e) {
          console.log("Error fetching user:", e);
          setUserData(prev => ({ ...prev, services: [] }));
        }
        setLoading(false);
      };
      
      const saveServices = async (uid, newServices) => {
        try {
          if (window.firebaseDb && uid) {
            await setDoc(doc(window.firebaseDb, "users", uid), { services: newServices }, { merge: true });
          }
          setUserData(prev => ({ ...prev, services: newServices }));
        } catch (e) {
          console.log("Error saving services:", e);
          setUserData(prev => ({ ...prev, services: newServices }));
        }
      };
      
      const toggleOnline = async (uid, status) => {
        try {
          if (window.firebaseDb && uid) {
            await setDoc(doc(window.firebaseDb, "users", uid), { isOnline: status }, { merge: true });
          }
          setUserData(prev => ({ ...prev, isOnline: status }));
        } catch (e) {
          setUserData(prev => ({ ...prev, isOnline: status }));
        }
      };
      
      return (
        <UserContext.Provider value={{ userData, loading, fetchUserData, saveServices, toggleOnline, setUserData }}>
          {children}
        </UserContext.Provider>
      );
    }

    // SERVICE TYPE MAPPING
    // ============================================
    const SERVICE_CATEGORY_MAP = {

      'lockout': 'emergency',

      'mechanic': ['battery', 'tire', 'fuel', 'towing', 'diagnostics']

            { id: 'earnings', label: 'Earnings', icon: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg> },
            { id: 'messages', label: 'Messages', icon: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg> },

        : [
            { id: 'home', label: 'Home', icon: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg> },

            { id: 'settings', label: 'Settings', icon: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg> }
          ];
      
      const tabIndex = tabs.findIndex(t => t.id === activeTab);
      const translateX = tabIndex * 100;
      
      return (
        <div className={`cyber-nav-container ${variant}`}>
          <div className="cyber-nav">
            <div className="cyber-nav-highlight" style={{transform: `translateX(${translateX}%)`}}>
              <div className="cyber-highlight-inner"></div>
            </div>
            {tabs.map((tab) => (
              <div

                <div className="glare"></div>
              </div>

          </div>
        </div>
      );
    }
    
    // ============================================
    // SPLASH SCREEN
    // ============================================
    function SplashScreen({ onComplete }) {
      const [visible, setVisible] = useState(true);
      
      useEffect(() => {
        const timer = setTimeout(() => {
          setVisible(false);
          setTimeout(onComplete, 400);

        return () => clearTimeout(timer);
      }, [onComplete]);

        <div style={{
          position: 'fixed',
          top: 0, left: 0, right: 0, bottom: 0,
          background: '#000',
          display: 'flex',
          alignItems: 'center',

              objectFit: 'contain',
              maxWidth: '100%',
              maxHeight: '100%',
            }}
          />
        </div>
      );
    }

    function App() {

      const [splashDone, setSplashDone] = useState(false);
      const [scrollY, setScrollY] = useState(0);
      useEffect(() => {

      return (

    function RoleSelectScreen({ onNavigate }) {

                <span style={{color: 'var(--mute)', fontSize: 12}}>Map</span>
              </div>
            </div>
            <div style={{display: 'flex', justifyContent: 'space-between', marginBottom: 20, gap: 12}}>
              <div style={{flex: 1, background: 'var(--canvas-soft)', padding: 16, borderRadius: 16}}>
                <div style={{color: 'var(--body)', fontSize: 12, marginBottom: 8}}>Earnings Today</div>
                <div style={{color: 'var(--ink)', fontSize: 22, fontWeight: 700}}>$256</div>
                <div style={{color: 'var(--body)', fontSize: 12, marginTop: 4}}>4 Jobs Completed</div>
              </div>
              <div style={{flex: 1, background: 'var(--canvas-soft)', padding: 16, borderRadius: 16}}>
                <div style={{color: 'var(--body)', fontSize: 12, marginBottom: 8}}>Incentives</div>
                <div style={{color: 'var(--body)', fontSize: 12}}>Complete 2 more jobs to earn $50</div>
                <div style={{height: 6, background: 'var(--surface-pressed)', borderRadius: 4, marginTop: 8, marginBottom: 4}}>
                  <div style={{width: '50%', height: '100%', background: 'var(--ink)', borderRadius: 4}} />
                </div>
                <div style={{color: 'var(--body)', fontSize: 12}}>2 / 4 Jobs</div>
              </div>
            </div>
            <div style={{marginBottom: 20}}>
              <div style={{color: 'var(--ink)', fontSize: 16, fontWeight: 600, marginBottom: 12}}>Nearby Jobs</div>
              {nearbyJobs.map((job) => (
                <div key={job.id} style={{display: 'flex', justifyContent: 'space-between', background: 'var(--canvas-soft)', padding: 14, borderRadius: 12, marginBottom: 10, cursor: 'pointer'}}>
                  <div>
                    <div style={{fontSize: 12, fontWeight: 500, color: 'var(--body)'}}>{job.time}</div>
                    <div style={{color: 'var(--ink)', fontWeight: 600, marginTop: 4}}>{job.service}</div>
                    <div style={{color: 'var(--body)', fontSize: 12, marginTop: 2}}>{job.address}</div>
                  </div>
                  <div style={{fontWeight: 600, fontSize: 14, color: 'var(--ink)'}}>{job.payout}</div>
                </div>
              ))}
            </div>
          </div>
          <CyberNav activeTab={navTab} onTabChange={handleNavTabChange} variant="provider" />
        </div>
      );
    }
    function ProviderJobsScreen({ onNavigate, goBack }) {
      const { userData, toggleOnline, saveServices, setUserData } = useContext(UserContext);
      const [selectedCategory, setSelectedCategory] = useState('all');
      const [showAddModal, setShowAddModal] = useState(false);
      const [activeJob, setActiveJob] = useState(null);
      const [todayEarnings, setTodayEarnings] = useState(85);
      const [jobsCompleted, setJobsCompleted] = useState(3);
      const [declinedJobs, setDeclinedJobs] = useState([]);
      const [navTab, setNavTab] = useState('jobs');
      const hour = new Date().getHours();
      const greeting = hour < 12 ? 'Good Morning' : hour < 17 ? 'Good Afternoon' : 'Good Evening';
      
      const handleNavTabChange = (tabId) => {
        setNavTab(tabId);
        if (tabId === 'home') onNavigate('/provider/home');
        else if (tabId === 'jobs') onNavigate('/provider/jobs');
        else if (tabId === 'earnings') onNavigate('/provider/earnings');
      };
      
      const isOnline = userData.isOnline;
      const userServices = userData.services || [];
      
      const getCategoriesFromServices = () => {
        const cats = [{ key: 'all', label: 'All' }];
        userServices.forEach(s => {
          const mapped = SERVICE_CATEGORY_MAP[s];
          if (Array.isArray(mapped)) {
            mapped.forEach(m => {
              const existing = cats.find(c => c.key === m);
              if (!existing) {
                const labels = { battery: 'Battery', tire: 'Tire', fuel: 'Fuel', towing: 'Towing', diagnostics: 'Diagnostics', emergency: 'Emergency' };
                cats.push({ key: m, label: labels[m] || m });
              }
            });
          } else if (mapped) {
            const existing = cats.find(c => c.key === mapped);
            if (!existing) {
              const labels = { roadside: 'Roadside', battery: 'Battery', tire: 'Tire', fuel: 'Fuel', towing: 'Towing', diagnostics: 'Diagnostics', emergency: 'Emergency' };
              cats.push({ key: mapped, label: labels[mapped] || mapped });
            }
          }
        });
        return cats;
      };
      
      const serviceCategories = getCategoriesFromServices();
      
      const getRemainingServices = () => {
        return SERVICE_TYPES.filter(s => !userServices.includes(s.key));
      };
      
      const allJobs = [
        { id: '1', service: 'Flat Tire Repair', category: 'tire', address: '123 Main St, Dayton', distance: '2.3 mi', payout: '$45-80', urgent: true, time: '2 min ago', rating: 4.8 },
        { id: '2', service: 'Battery Jump Start', category: 'battery', address: '456 Oak Ave, Dayton', distance: '1.5 mi', payout: '$25-50', urgent: false, time: '5 min ago', rating: 4.9 },
        { id: '3', service: 'Fuel Delivery', category: 'fuel', address: '789 Elm St, Dayton', distance: '3.1 mi', payout: '$35-60', urgent: false, time: '8 min ago', rating: 4.7 },
        { id: '4', service: 'Lockout Service', category: 'emergency', address: '321 Pine Rd, Dayton', distance: '0.8 mi', payout: '$40-70', urgent: true, time: '1 min ago', rating: 5.0 },
        { id: '5', service: 'Towing Service', category: 'towing', address: '654 Maple Dr, Dayton', distance: '4.2 mi', payout: '$75-150', urgent: false, time: '12 min ago', rating: 4.6 },
        { id: '6', service: 'Diagnostic Check', category: 'diagnostics', address: '987 Cedar Ln, Dayton', distance: '2.0 mi', payout: '$50-90', urgent: false, time: '15 min ago', rating: 4.8 },
      ];
      
      const filteredJobs = selectedCategory === 'all' 
        ? allJobs.filter(j => !declinedJobs.includes(j.id))
        : allJobs.filter(j => j.category === selectedCategory && !declinedJobs.includes(j.id));
      
      const handleAcceptJob = (job) => { setActiveJob(job); };
      const handleDeclineJob = (jobId) => { setDeclinedJobs([...declinedJobs, jobId]); };
      const handleCompleteJob = () => {
        const payout = parseInt(activeJob.payout.split('-')[1].replace('$',''));
        setTodayEarnings(todayEarnings + payout);
        setJobsCompleted(jobsCompleted + 1);
        setActiveJob(null);
      };
      
      const handleAddService = async (serviceKey) => {
        const newServices = [...userServices, serviceKey];
        await saveServices(userData.uid, newServices);
        setUserData(prev => ({ ...prev, services: newServices }));
        setShowAddModal(false);
      };
      
      const remainingServices = getRemainingServices();
      const canAddMore = remainingServices.length > 0;
      
      return (
        <div className="h-full w-full" style={{background: '#F5F5F5', display: 'flex', flexDirection: 'column', height: '100dvh', overflow: 'hidden', paddingBottom: '70px'}}>
          <div style={{background: 'var(--ink)', padding: '14px 16px 10px'}}>
            <div className="row centerV" style={{justifyContent: 'space-between', marginBottom: '12px'}}>
              <div>
                <div className="text-white font-bold" style={{fontSize: '18px'}}>{greeting}!</div>
                <div className="text-white" style={{fontSize: '12px', opacity: 0.7}}>Ready to work?</div>
              </div>
              <div className="row centerV" style={{gap: 8}}>
                <div style={{width: '32px', height: '32px', borderRadius: '50%', background: 'rgba(255,255,255,0.2)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '14px', color: '#fff'}}>◉</div>
              </div>
            </div>
            <div style={{ background: isOnline ? 'var(--black-elevated)' : 'rgba(255,255,255,0.15)', borderRadius: '16px', padding: '12px', display: 'flex', alignItems: 'center', justifyContent: 'space-between'}}>
              <div>
                <div className="text-white font-semibold" style={{fontSize: '14px'}}>Available Jobs Nearby</div>
                <div className="text-white font-bold" style={{fontSize: '22px', marginTop: '2px'}}>{isOnline ? filteredJobs.length : 0}</div>
                {isOnline && <div className="text-white" style={{fontSize: '11px', opacity: 0.8}}>Live jobs in your area</div>}
              </div>
              <button onClick={() => toggleOnline(userData.uid, !isOnline)} style={{ background: isOnline ? '#fff' : 'transparent', border: '1px solid ' + (isOnline ? '#fff' : 'rgba(255,255,255,0.5)'), borderRadius: '999px', padding: '8px 20px', fontWeight: '600', fontSize: '13px', color: isOnline ? 'var(--ink)' : '#fff', cursor: 'pointer' }}>
                {isOnline ? 'Go Offline' : 'Go Online'}
              </button>
            </div>
          </div>
          <div style={{padding: '12px 16px', background: 'var(--canvas)'}}>
            <div style={{fontSize: 10, fontWeight: 600, color: 'var(--body)', marginBottom: 8}}>Quick Filters</div>
            <div style={{display: 'flex', gap: '6px', overflowX: 'auto', paddingBottom: '4px'}}>
              {serviceCategories.map((cat) => (
                <button key={cat.key} onClick={() => setSelectedCategory(cat.key)} style={{ background: selectedCategory === cat.key ? 'var(--ink)' : 'var(--canvas-soft)', color: selectedCategory === cat.key ? '#fff' : 'var(--body)', border: 'none', borderRadius: '999px', padding: '6px 14px', fontSize: '11px', fontWeight: '500', whiteSpace: 'nowrap', cursor: 'pointer'}}>
                  {cat.label}
                </button>
              ))}
              {canAddMore && (
                <button onClick={() => setShowAddModal(true)} style={{ background: 'var(--canvas-soft)', color: 'var(--body)', border: 'none', borderRadius: '999px', padding: '6px 14px', fontSize: '11px', fontWeight: '500', whiteSpace: 'nowrap', cursor: 'pointer'}}>
                  + Add
                </button>
              )}
            </div>
          </div>
          <div style={{flex: 1, overflowY: 'auto', padding: '12px'}}>
            <div className="row centerV" style={{justifyContent: 'space-between', marginBottom: '12px'}}>
              <span className="font-semibold" style={{fontSize: '16px'}}>{isOnline ? 'Live Jobs' : 'Jobs Available'}</span>
              {!isOnline && <span className="text-sm text-gray">Go online to see jobs</span>}
            </div>
            {isOnline ? (
              filteredJobs.length > 0 ? (
                filteredJobs.map((job) => (
                  <div key={job.id} className="animate-fade-in-up" style={{ background: 'var(--canvas)', borderRadius: '16px', padding: '16px', marginBottom: '12px', boxShadow: '0 4px 16px rgba(0,0,0,0.12)'}}>
                    <div className="row centerV" style={{justifyContent: 'space-between', marginBottom: '8px'}}>
                      <div className="row centerV gap-sm">
                        <span style={{fontWeight: 600}}>{job.service}</span>
                        {job.urgent && <span style={{background: 'var(--canvas-soft)', color: 'var(--body)', padding: '2px 8px', borderRadius: '999px', fontSize: '10px', fontWeight: '600'}}>Urgent</span>}
                      </div>
                      <span style={{fontSize: 12, color: 'var(--mute)'}}>{job.time}</span>
                    </div>
                    <div style={{fontSize: 13, color: 'var(--body)', marginBottom: 12}}>{job.address} · {job.distance}</div>
                    <div className="row centerV" style={{justifyContent: 'space-between'}}>
                      <div>
                        <div className="font-bold" style={{fontSize: '20px', color: 'var(--ink)'}}>{job.payout}</div>
                        <div style={{fontSize: 12, color: 'var(--mute)'}}>{job.rating}</div>
                      </div>
                      <div className="row gap-sm">
                        <button onClick={() => handleDeclineJob(job.id)} className="btn btn-sm btn-white">Decline</button>
                        <button onClick={() => handleAcceptJob(job)} className="btn btn-sm">Accept</button>
                      </div>
                    </div>
                  </div>
                ))
              ) : (
                <div style={{textAlign: 'center', padding: '40px'}}>
                  <div style={{fontSize: '36px', marginBottom: '16px', color: 'var(--mute)'}}>—</div>
                  <div className="font-semibold" style={{marginBottom: '8px'}}>No jobs found</div>
                  <div className="text-sm" style={{color: 'var(--body)'}}>Try a different filter or check back soon</div>
                </div>
              )
            ) : (
              <div style={{ background: 'var(--canvas)', borderRadius: '16px', padding: '32px', textAlign: 'center'}}>
                <div style={{fontSize: '36px', marginBottom: '16px', color: 'var(--mute)'}}>—</div>
                <div className="font-semibold" style={{marginBottom: '8px'}}>Go Online to Start Receiving Jobs</div>
                <div className="text-sm" style={{color: 'var(--body)'}}>Toggle online above to begin accepting jobs</div>
              </div>
            )}
          </div>
          {activeJob && (
            <>
              <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, background: 'rgba(0,0,0,0.5)', zIndex: 100, display: 'flex', alignItems: 'flex-end'}}>
                <div style={{ background: 'var(--canvas)', borderRadius: '24px 24px 0 0', padding: '24px', width: '100%'}}>
                  <div className="row centerV" style={{justifyContent: 'space-between', marginBottom: '16px'}}>
                    <span className="font-semibold" style={{fontSize: '18px'}}>Active Job</span>
                    <button onClick={() => setActiveJob(null)} style={{background: 'none', border: 'none', fontSize: '24px', cursor: 'pointer', color: 'var(--body)'}}>×</button>
                  </div>
                  <div style={{background: 'var(--ink)', borderRadius: '16px', padding: '20px', marginBottom: '20px'}}>
                    <div className="text-white font-bold" style={{fontSize: '20px', marginBottom: '8px'}}>{activeJob.service}</div>
                    <div className="text-white" style={{opacity: 0.7, fontSize: '14px'}}>{activeJob.address}</div>
                    <div className="text-white font-bold" style={{fontSize: '24px', marginTop: '12px'}}>{activeJob.payout}</div>
                  </div>
                  <button className="btn btn-lg" onClick={handleCompleteJob} style={{width: '100%'}}>Complete Job</button>
                </div>
              </div>
              {showAddModal && (
                <div style={{position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, background: 'rgba(0,0,0,0.5)', zIndex: 100, display: 'flex', alignItems: 'center', justifyContent: 'center'}} onClick={() => setShowAddModal(false)}>
                  <div className="card" style={{padding: 20, width: '85%', maxWidth: 320}} onClick={e => e.stopPropagation()}>
                    <div className="row centerV" style={{justifyContent: 'space-between', marginBottom: 16}}>
                      <span className="font-semibold" style={{fontSize: 16}}>Add Services</span>
                      <button onClick={() => setShowAddModal(false)} style={{background: 'none', border: 'none', fontSize: 20, cursor: 'pointer', color: 'var(--body)'}}>×</button>
                    </div>
                    <div style={{display: 'flex', flexDirection: 'column', gap: 8}}>
                      {remainingServices.map(s => (
                        <div key={s.key} onClick={() => handleAddService(s.key)} style={{display: 'flex', alignItems: 'center', gap: 12, padding: 12, background: 'var(--canvas-soft)', borderRadius: 12, cursor: 'pointer'}}>
                          <span style={{fontSize: 24}}>{s.icon}</span>
                          <div style={{flex: 1}}>
                            <div className="font-semibold" style={{fontSize: 14}}>{s.label}</div>
                            <div style={{fontSize: 12, color: 'var(--body)'}}>{s.desc}</div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}
            </>
          )}
          <CyberNav activeTab={navTab} onTabChange={handleNavTabChange} variant="provider" />
        </div>
      );
    }
    function ProviderEarningsScreen({ onNavigate, goBack }) {
      const [navTab, setNavTab] = useState('earnings');
      const handleNavTabChange = (tabId) => {
        setNavTab(tabId);
        if (tabId === 'home') onNavigate('/provider/home');
        else if (tabId === 'jobs') onNavigate('/provider/jobs');
        else if (tabId === 'earnings') onNavigate('/provider/earnings');
      };
      return (
        <div className="container" style={{paddingBottom: '70px', background: 'var(--canvas-soft)'}}>
          <div className="p-lg pt-xl"><span className="text-2xl cursor-pointer" onClick={goBack}>←</span></div>
          <div className="p-lg">
            <div className="text-xl font-semibold mb-lg">Earnings</div>
            <div className="p-xl" style={{background: 'var(--ink)', borderRadius: 16, marginBottom: 24}}>
              <div style={{fontSize: 12, color: 'var(--mute)'}}>Total</div>
              <div style={{fontSize: 40, fontWeight: 700, color: '#fff', marginTop: 4}}>$1,250</div>
              <div className="row gap-lg mt-lg">
                <div><div style={{fontSize: 20, fontWeight: 700, color: '#fff'}}>18</div><div style={{fontSize: 12, color: 'var(--mute)'}}>Jobs</div></div>
                <div><div style={{fontSize: 20, fontWeight: 700, color: '#fff'}}>$69</div><div style={{fontSize: 12, color: 'var(--mute)'}}>Avg</div></div>
              </div>
            </div>
          </div>
          <CyberNav activeTab={navTab} onTabChange={handleNavTabChange} variant="provider" />
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
