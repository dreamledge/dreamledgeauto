  <script type="text/babel">
    const { useState, useEffect, createContext, useContext } = React;
    const SERVICE_TYPES = [
      { key: 'mechanic', label: 'Mobile Mechanic', icon: '🔧', desc: 'On-site repairs' },
      { key: 'tire_change', label: 'Tire Change', icon: '❕', desc: 'Flat tire fix' },
      { key: 'battery_jump', label: 'Battery Jump', icon: '🔋', desc: 'Dead battery' },
      { key: 'towing', label: 'Towing', icon: '🚗', desc: 'Vehicle transport' },
      { key: 'fuel_delivery', label: 'Fuel Delivery', icon: '⛽', desc: 'Gas delivery' },
      { key: 'lockout', label: 'Lockout', icon: '🔐', desc: 'Key issues' },
    ];
    const FEATURES = [
      { icon: '⚡', title: 'Fast Response', desc: 'Mechanics arrive within 30 minutes' },
      { icon: '💰', title: 'Transparent Pricing', desc: 'No hidden fees or surprises' },
      { icon: '⭐', title: 'Verified Pros', desc: 'Background-checked mechanics' },
      { icon: '📱', title: 'Easy Booking', desc: 'Book in seconds' },
    ];
    const TESTIMONIALS = [
      { name: 'Sarah M.', text: 'Saved my day! Mechanic showed up in 20 mins.', rating: 5 },
      { name: 'Mike D.', text: 'Best pricing ever. Highly recommend!', rating: 5 },
      { name: 'Lisa K.', text: 'So easy to use. Found help instantly.', rating: 5 },
    ];
    // ============================================
    // USER CONTEXT
    // ============================================
    const UserContext = createContext(null);
    
    function UserProvider({ children }) {
      const [userData, setUserData] = useState({
        uid: null,
        services: [],
        isOnline: false,
        role: null
      });
      const [loading, setLoading] = useState(true);
      
      const fetchUserData = async (uid) => {
        try {
          if (window.firebaseDb && uid) {
            const docRef = doc(window.firebaseDb, "users", uid);
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) {
              const data = docSnap.data();
              setUserData(prev => ({ ...prev, uid, services: data.services || [], isOnline: data.isOnline || false }));
            } else {
              setUserData(prev => ({ ...prev, uid, services: [] }));
            }
          } else {
            setUserData(prev => ({ ...prev, uid, services: [] }));
          }
        } catch (e) {
          console.log("Error fetching user:", e);
          setUserData(prev => ({ ...prev, services: [] }));
        }
        setLoading(false);
      };
      
      const saveServices = async (uid, newServices) => {
        try {
          if (window.firebaseDb && uid) {
            await setDoc(doc(window.firebaseDb, "users", uid), { services: newServices }, { merge: true });
          }
          setUserData(prev => ({ ...prev, services: newServices }));
        } catch (e) {
          console.log("Error saving services:", e);
          setUserData(prev => ({ ...prev, services: newServices }));
        }
      };
      
      const toggleOnline = async (uid, status) => {
        try {
          if (window.firebaseDb && uid) {
            await setDoc(doc(window.firebaseDb, "users", uid), { isOnline: status }, { merge: true });
          }
          setUserData(prev => ({ ...prev, isOnline: status }));
        } catch (e) {
          setUserData(prev => ({ ...prev, isOnline: status }));
        }
      };
      
      return (
        <UserContext.Provider value={{ userData, loading, fetchUserData, saveServices, toggleOnline, setUserData }}>
          {children}
        </UserContext.Provider>
      );
    }

    root.render(<App />);
  </script>
