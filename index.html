        return () => observer.disconnect();

    /* Animated counter hook */
    function useCounter(target, duration = 1500, start = false) {
      const [count, setCount] = useState(0);
      useEffect(() => {
        if (!start) return;
        let startTime = null;
        const animate = (ts) => {
          if (!startTime) startTime = ts;
          const progress = Math.min((ts - startTime) / duration, 1);
          setCount(Math.floor(progress * target));
          if (progress < 1) requestAnimationFrame(animate);
        };
        requestAnimationFrame(animate);
      }, [start, target, duration]);
      return count;
    }

                <button className="btn btn-sm" onClick={(e) => { e.stopPropagation(); onNavigate('/customer/home'); }}>Accept</button>

            </div>
          ))}

      </div>);
    }

    function ProviderHomeScreen({ onNavigate, goBack }) {
      const { userData, toggleOnline } = useContext(UserContext);
      const [navTab, setNavTab] = useState('home'); const [isOnline, setIsOnline] = useState(userData?.isOnline || false);
      const hour = new Date().getHours(); const greeting = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
      const name = userData?.name || 'there';
      const handleNavTabChange = (tabId) => { setNavTab(tabId); if (tabId === 'home') onNavigate('/provider/home'); else if (tabId === 'jobs') onNavigate('/provider/jobs'); else if (tabId === 'earnings') onNavigate('/provider/earnings'); };
      const handleToggle = () => { const newStatus = !isOnline; setIsOnline(newStatus); if (userData?.uid) toggleOnline(userData.uid, newStatus); };
      const nearbyJobs = [{ id: '1', service: 'Oil Change', address: '456 Oak Ave', time: '20 min away', payout: '$45 - $60' }, { id: '2', service: 'Tire Rotation', address: '789 Elm St', time: '25 min away', payout: '$35 - $50' }];
      return (<div className="h-full w-full" style={{display: 'flex', flexDirection: 'column', height: '100dvh', overflow: 'hidden', paddingBottom: '80px'}}>
        <div style={{flex: 1, overflowY: 'auto', padding: '20px'}}>
          <div className="row between centerV mb-lg">
            <div><div className="title-lg" style={{letterSpacing: '-0.3px'}}>{greeting}, {name}</div><div className="body-sm mt-xs" style={{color: 'var(--body)'}}>Ready to get some jobs done?</div></div>
            <div className="row centerV" style={{gap: 14}}>
              <div style={{position: 'relative'}}><span style={{fontSize: 24}}>◉</span><div style={{position: 'absolute', top: -2, right: -2, width: 8, height: 8, borderRadius: '50%', background: 'var(--primary)'}} /></div>
              <div style={{position: 'relative'}}><div className="avatar">M</div><div style={{position: 'absolute', bottom: 0, right: 0, width: 10, height: 10, borderRadius: '50%', background: 'var(--success)', border: '2px solid var(--canvas)'}} /></div>
            </div>
          </div>
          <div className="row between centerV card-flat mb-lg" style={{padding: 18, borderRadius: 'var(--radius-lg)'}}>
            <div className="row centerV" style={{gap: 14}}>
              <span style={{fontSize: 30, color: isOnline ? 'var(--success)' : 'var(--muted)'}}>◉</span>
              <div><div className="title-sm">{isOnline ? "You're Online" : "You're Offline"}</div><div className="body-sm" style={{color: 'var(--body)'}}>{isOnline ? "Visible to customers" : "Go online to receive jobs"}</div></div>
            </div>
            <button onClick={handleToggle} className={`btn btn-sm ${isOnline ? 'btn-outline' : ''}`}>{isOnline ? 'Go Offline' : 'Go Online'}</button>
          </div>
          <div className="grid grid-4 mb-lg" style={{gap: 10}}>
            {[{ label: 'Jobs Today', value: '3' }, { label: 'Rating', value: '4.9' }, { label: 'Earnings', value: '$256' }, { label: 'Time', value: '8h' }].map((item, index) => (
              <div key={index} className="card-flat" style={{padding: '14px 10px', textAlign: 'center', borderRadius: 'var(--radius-md)'}}>
                <div className="title-sm">{item.value}</div>
                <div className="caption" style={{color: 'var(--body)'}}>{item.label}</div>
              </div>
            ))}
          </div>
          <div className="card-flat mb-lg" style={{padding: 20, borderRadius: 'var(--radius-lg)', display: 'flex', flexDirection: 'column', gap: 18}}>
            <div>
              <div className="caption" style={{letterSpacing: '0.06em', color: 'var(--body)'}}>Upcoming</div>
              <div className="display-sm" style={{marginTop: 6, letterSpacing: '-0.5px'}}>10:30 AM</div>
              <div className="title-sm mt-xs">Jump Start</div>
              <div className="body-sm" style={{color: 'var(--body)'}}>123 Main St</div>
              <div className="body-sm" style={{color: 'var(--body)'}}>2.4 mi away</div>
              <button className="btn btn-sm" style={{marginTop: 14}}>Start Navigation</button>
            </div>
            <div style={{width: '100%', height: 130, background: 'var(--surface-soft)', borderRadius: 'var(--radius-lg)', display: 'flex', alignItems: 'center', justifyContent: 'center', border: '1px solid var(--hairline-soft)'}}><span style={{color: 'var(--muted)', fontSize: 12}}>Map</span></div>
          </div>
          <div className="col gap-sm mb-lg">
            <div className="card-flat" style={{padding: 18, borderRadius: 'var(--radius-lg)'}}>
              <div className="caption" style={{color: 'var(--body)'}}>Earnings Today</div>
              <div className="display-sm" style={{letterSpacing: '-0.5px'}}>$256</div>
              <div className="body-sm" style={{color: 'var(--body)', marginTop: 6}}>4 Jobs Completed</div>
            </div>
            <div className="card-flat" style={{padding: 18, borderRadius: 'var(--radius-lg)'}}>
              <div className="caption" style={{color: 'var(--body)'}}>Incentives</div>
              <div className="body-sm">Complete 2 more jobs to earn $50 bonus</div>
              <div style={{height: 6, background: 'var(--surface-strong)', borderRadius: 4, marginTop: 10, marginBottom: 6}}><div style={{width: '50%', height: '100%', background: 'var(--primary)', borderRadius: 4}} /></div>
              <div className="caption" style={{color: 'var(--body)'}}>2 / 4 Jobs</div>
            </div>
          </div>
          <div style={{marginBottom: 24}}>
            <div className="title-sm mb-md" style={{letterSpacing: '-0.1px'}}>Nearby Jobs</div>
            {nearbyJobs.map((job) => (
              <div key={job.id} className="card-flat card-hover mb-md" style={{padding: 16, display: 'flex', justifyContent: 'space-between', borderRadius: 'var(--radius-md)'}}>
                <div>
                  <div className="caption" style={{color: 'var(--body)'}}>{job.time}</div>
                  <div className="title-sm mt-xs">{job.service}</div>
                  <div className="body-sm" style={{color: 'var(--body)'}}>{job.address}</div>
                </div>
                <div className="title-sm">{job.payout}</div>

            ))}
          </div>
        </div>
        <BottomNav activeTab={navTab} onTabChange={handleNavTabChange} variant="provider" />
      </div>);

    function ProviderJobsScreen({ onNavigate, goBack }) {
      const { userData, toggleOnline, saveServices, setUserData } = useContext(UserContext);
      const [selectedCategory, setSelectedCategory] = useState('all'); const [showAddModal, setShowAddModal] = useState(false); const [activeJob, setActiveJob] = useState(null); const [todayEarnings, setTodayEarnings] = useState(85); const [jobsCompleted, setJobsCompleted] = useState(3); const [declinedJobs, setDeclinedJobs] = useState([]); const [navTab, setNavTab] = useState('jobs');
      const hour = new Date().getHours(); const greeting = hour < 12 ? 'Good Morning' : hour < 17 ? 'Good Afternoon' : 'Good Evening';
      const handleNavTabChange = (tabId) => { setNavTab(tabId); if (tabId === 'home') onNavigate('/provider/home'); else if (tabId === 'jobs') onNavigate('/provider/jobs'); else if (tabId === 'earnings') onNavigate('/provider/earnings'); };
      const isOnline = userData.isOnline; const userServices = userData.services || [];
      const getCategoriesFromServices = () => { const cats = [{ key: 'all', label: 'All' }]; userServices.forEach(s => { const mapped = SERVICE_CATEGORY_MAP[s]; if (Array.isArray(mapped)) { mapped.forEach(m => { const existing = cats.find(c => c.key === m); if (!existing) { const labels = { battery: 'Battery', tire: 'Tire', fuel: 'Fuel', towing: 'Towing', diagnostics: 'Diagnostics', emergency: 'Emergency' }; cats.push({ key: m, label: labels[m] || m }); } }); } else if (mapped) { const existing = cats.find(c => c.key === mapped); if (!existing) { const labels = { roadside: 'Roadside', battery: 'Battery', tire: 'Tire', fuel: 'Fuel', towing: 'Towing', diagnostics: 'Diagnostics', emergency: 'Emergency' }; cats.push({ key: mapped, label: labels[mapped] || mapped }); } } }); return cats; };
      const serviceCategories = getCategoriesFromServices();
      const getRemainingServices = () => SERVICE_TYPES.filter(s => !userServices.includes(s.key));
      const allJobs = [{ id: '1', service: 'Flat Tire Repair', category: 'tire', address: '123 Main St, Dayton', distance: '2.3 mi', payout: '$45-80', urgent: true, time: '2 min ago', rating: 4.8 }, { id: '2', service: 'Battery Jump Start', category: 'battery', address: '456 Oak Ave, Dayton', distance: '1.5 mi', payout: '$25-50', urgent: false, time: '5 min ago', rating: 4.9 }, { id: '3', service: 'Fuel Delivery', category: 'fuel', address: '789 Elm St, Dayton', distance: '3.1 mi', payout: '$35-60', urgent: false, time: '8 min ago', rating: 4.7 }, { id: '4', service: 'Lockout Service', category: 'emergency', address: '321 Pine Rd, Dayton', distance: '0.8 mi', payout: '$40-70', urgent: true, time: '1 min ago', rating: 5.0 }, { id: '5', service: 'Towing Service', category: 'towing', address: '654 Maple Dr, Dayton', distance: '4.2 mi', payout: '$75-150', urgent: false, time: '12 min ago', rating: 4.6 }, { id: '6', service: 'Diagnostic Check', category: 'diagnostics', address: '987 Cedar Ln, Dayton', distance: '2.0 mi', payout: '$50-90', urgent: false, time: '15 min ago', rating: 4.8 }];
      const filteredJobs = selectedCategory === 'all' ? allJobs.filter(j => !declinedJobs.includes(j.id)) : allJobs.filter(j => j.category === selectedCategory && !declinedJobs.includes(j.id));
      const handleAcceptJob = (job) => { setActiveJob(job); };
      const handleDeclineJob = (jobId) => { setDeclinedJobs([...declinedJobs, jobId]); };
      const handleCompleteJob = () => { const payout = parseInt(activeJob.payout.split('-')[1].replace('$','')); setTodayEarnings(todayEarnings + payout); setJobsCompleted(jobsCompleted + 1); setActiveJob(null); };
      const handleAddService = async (serviceKey) => { const newServices = [...userServices, serviceKey]; await saveServices(userData.uid, newServices); setUserData(prev => ({ ...prev, services: newServices })); setShowAddModal(false); };
      const remainingServices = getRemainingServices(); const canAddMore = remainingServices.length > 0;
      return (<div className="h-full w-full" style={{display: 'flex', flexDirection: 'column', height: '100dvh', overflow: 'hidden', paddingBottom: '80px'}}>
        <div style={{background: 'var(--surface-dark)', padding: '16px 20px 12px'}}>
          <div className="row centerV" style={{justifyContent: 'space-between', marginBottom: 14}}>
            <div><div className="title-md text-white" style={{letterSpacing: '-0.15px'}}>{greeting}!</div><div className="body-sm text-white" style={{opacity: 0.7}}>Ready to work?</div></div>
            <div className="row centerV" style={{gap: 10}}><div style={{width: 36, height: 36, borderRadius: '50%', background: 'rgba(255,255,255,0.15)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 14, color: '#fff'}}>◉</div></div>
          </div>
          <div className="row between centerV" style={{background: isOnline ? 'var(--surface-dark-elevated)' : 'rgba(255,255,255,0.12)', borderRadius: 'var(--radius-md)', padding: 14}}>
            <div><div className="title-sm text-white">Available Jobs Nearby</div><div className="display-sm text-white" style={{marginTop: 4, letterSpacing: '-0.5px'}}>{isOnline ? filteredJobs.length : 0}</div>{isOnline && <div className="caption text-white" style={{opacity: 0.8}}>Live jobs in your area</div>}</div>
            <button onClick={() => toggleOnline(userData.uid, !isOnline)} className={`btn btn-sm ${isOnline ? 'btn-secondary' : ''}`} style={{background: isOnline ? '#fff' : 'transparent', border: '1px solid ' + (isOnline ? '#fff' : 'rgba(255,255,255,0.4)'), color: isOnline ? 'var(--ink)' : '#fff'}}>{isOnline ? 'Go Offline' : 'Go Online'}</button>
          </div>
        </div>
        <div style={{padding: '14px 20px', background: 'var(--canvas)', borderBottom: '1px solid var(--hairline-soft)'}}>
          <div className="caption mb-sm" style={{color: 'var(--body)'}}>Quick Filters</div>
          <div className="row" style={{gap: 8, overflowX: 'auto', paddingBottom: 4}}>
            {serviceCategories.map((cat) => (
              <button key={cat.key} onClick={() => setSelectedCategory(cat.key)} className={`btn btn-sm ${selectedCategory === cat.key ? '' : 'btn-outline'}`} style={{whiteSpace: 'nowrap', minWidth: 44}}>{cat.label}</button>
            ))}
            {canAddMore && (<button onClick={() => setShowAddModal(true)} className="btn btn-sm btn-outline" style={{whiteSpace: 'nowrap', minWidth: 44}}>+ Add</button>)}
          </div>
        </div>
        <div style={{flex: 1, overflowY: 'auto', padding: 14}}>
          <div className="row between centerV mb-md"><span className="title-sm" style={{letterSpacing: '-0.1px'}}>{isOnline ? 'Live Jobs' : 'Jobs Available'}</span>{!isOnline && <span className="caption" style={{color: 'var(--muted)'}}>Go online to see jobs</span>}</div>
          {isOnline ? (filteredJobs.length > 0 ? (filteredJobs.map((job) => (
            <div key={job.id} className="card-elevated mb-md animate-fade-in-up" style={{padding: 18, borderRadius: 'var(--radius-lg)'}}>
              <div className="row between centerV mb-sm">
                <div className="row centerV gap-sm"><span className="title-sm">{job.service}</span>{job.urgent && <span className="badge badge-default">Urgent</span>}</div>
                <span className="caption" style={{color: 'var(--muted)'}}>{job.time}</span>
              </div>
              <div className="body-sm mb-md" style={{color: 'var(--body)'}}>{job.address} · {job.distance}</div>
              <div className="row between centerV">
                <div><div className="display-sm" style={{letterSpacing: '-0.5px'}}>{job.payout}</div><div className="caption" style={{color: 'var(--muted)'}}>{job.rating}</div></div>
                <div className="row gap-sm">
                  <button onClick={() => handleDeclineJob(job.id)} className="btn btn-sm btn-outline">Decline</button>
                  <button onClick={() => handleAcceptJob(job)} className="btn btn-sm">Accept</button>
                </div>
              </div>
            </div>
          ))) : (<div className="text-center" style={{padding: 48}}><div style={{fontSize: 40, marginBottom: 18, color: 'var(--muted)'}}>—</div><div className="title-sm mb-xs">No jobs found</div><div className="body-sm" style={{color: 'var(--body)'}}>Try a different filter or check back soon</div></div>)) : (<div className="card text-center" style={{padding: 40, borderRadius: 'var(--radius-lg)'}}><div style={{fontSize: 40, marginBottom: 18, color: 'var(--muted)'}}>—</div><div className="title-sm mb-xs">Go Online to Start Receiving Jobs</div><div className="body-sm" style={{color: 'var(--body)'}}>Toggle online above to begin accepting jobs</div></div>)}
        </div>
        {activeJob && (<>
          <div style={{position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, background: 'rgba(0,0,0,0.5)', zIndex: 100, display: 'flex', alignItems: 'flex-end'}} onClick={() => setActiveJob(null)}>
            <div style={{background: 'var(--canvas)', borderRadius: 'var(--radius-xl) var(--radius-xl) 0 0', padding: 28, width: '100%'}} onClick={e => e.stopPropagation()}>
              <div className="row between centerV mb-lg"><span className="title-lg" style={{letterSpacing: '-0.3px'}}>Active Job</span><button onClick={() => setActiveJob(null)} style={{background: 'none', border: 'none', fontSize: 26, cursor: 'pointer', color: 'var(--body)', width: 40, height: 40, display: 'flex', alignItems: 'center', justifyContent: 'center', borderRadius: '50%'}}>×</button></div>
              <div className="card-flat mb-lg" style={{background: 'var(--surface-dark)', padding: 24, borderRadius: 'var(--radius-lg)'}}>
                <div className="display-sm text-white mb-xs" style={{letterSpacing: '-0.5px'}}>{activeJob.service}</div>
                <div className="body-sm text-white" style={{opacity: 0.7}}>{activeJob.address}</div>
                <div className="display-md text-white" style={{marginTop: 14, letterSpacing: '-0.75px'}}>{activeJob.payout}</div>
              </div>
              <button className="btn btn-lg" onClick={handleCompleteJob} style={{width: '100%'}}>Complete Job</button>
            </div>
          </div>
          {showAddModal && (<div style={{position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, background: 'rgba(0,0,0,0.5)', zIndex: 100, display: 'flex', alignItems: 'center', justifyContent: 'center'}} onClick={() => setShowAddModal(false)}>
            <div className="card" style={{padding: 24, width: '85%', maxWidth: 340, borderRadius: 'var(--radius-xl)'}} onClick={e => e.stopPropagation()}>
              <div className="row between centerV mb-lg"><span className="title-md" style={{letterSpacing: '-0.15px'}}>Add Services</span><button onClick={() => setShowAddModal(false)} style={{background: 'none', border: 'none', fontSize: 22, cursor: 'pointer', color: 'var(--body)', width: 40, height: 40, display: 'flex', alignItems: 'center', justifyContent: 'center', borderRadius: '50%'}}>×</button></div>
              <div className="col" style={{gap: 10}}>
                {remainingServices.map(s => (
                  <div key={s.key} onClick={() => handleAddService(s.key)} className="row centerV card-hover" style={{gap: 14, padding: 14, background: 'var(--surface-card)', borderRadius: 'var(--radius-md)', cursor: 'pointer'}}>
                    <span style={{fontSize: 26}}>{s.icon}</span>
                    <div style={{flex: 1}}><div className="title-sm">{s.label}</div><div className="body-sm" style={{color: 'var(--body)'}}>{s.desc}</div></div>
                  </div>
                ))}
              </div>
            </div>
          </div>)}
        </>)}
        <BottomNav activeTab={navTab} onTabChange={handleNavTabChange} variant="provider" />
      </div>);
    }

    function ProviderEarningsScreen({ onNavigate, goBack }) {
      const [navTab, setNavTab] = useState('earnings');
      const handleNavTabChange = (tabId) => { setNavTab(tabId); if (tabId === 'home') onNavigate('/provider/home'); else if (tabId === 'jobs') onNavigate('/provider/jobs'); else if (tabId === 'earnings') onNavigate('/provider/earnings'); };
      return (<div className="container" style={{paddingBottom: '80px'}}>
        <div className="p-lg pt-xl"><span className="display-sm cursor-pointer" onClick={goBack} style={{opacity: 0.7}}>←</span></div>
        <div className="p-lg">
          <div className="title-lg mb-lg" style={{letterSpacing: '-0.3px'}}>Earnings</div>
          <div className="card-flat" style={{background: 'var(--surface-dark)', padding: 28, borderRadius: 'var(--radius-xl)', marginBottom: 28}}>
            <div className="caption" style={{color: 'var(--muted)'}}>Total</div>
            <div className="display-xl text-white" style={{marginTop: 6, letterSpacing: '-2px'}}>$1,250</div>
            <div className="row gap-xl mt-lg">
              <div><div className="display-sm text-white" style={{letterSpacing: '-0.5px'}}>18</div><div className="caption" style={{color: 'var(--muted)'}}>Jobs</div></div>
              <div><div className="display-sm text-white" style={{letterSpacing: '-0.5px'}}>$69</div><div className="caption" style={{color: 'var(--muted)'}}>Avg</div></div>
            </div>
          </div>
        </div>
        <BottomNav activeTab={navTab} onTabChange={handleNavTabChange} variant="provider" />
      </div>);
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
